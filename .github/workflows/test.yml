name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bağımlılıklar (CI'da ekransız OpenCV)
        run: |
          python -m pip install pytest numpy opencv-python-headless
      - name: Testler
        run: python -m pytest -q
      - name: Demo (20/20 olmalı)
        run: python -m gozcu --klasor ci_calisma demo
      - name: Kurulum kontrolü
        run: python -m gozcu --klasor ci_calisma kontrol
